一方亭台，藏万千计策。</span></span></p><p yne-bulb-block="paragraph" style="text-align:center;"><span leaf="">————————————————————</span></p><p yne-bulb-block="paragraph" style="text-align:center;"><span leaf=""><br  /></span></p><p yne-bulb-block="paragraph" style="text-align:center;"><span style="color: rgb(17, 17, 17);font-size: 14px;"><span leaf="" style="line-height: 1.75;white-space: pre-wrap;text-align: center;"><span textstyle="" style="font-size: 16px;">这个六一，我</span></span><span leaf=""><span textstyle="" style="font-size: 16px;">们找来了帮手，和你一起</span></span></span><span style="font-size: 14px;"><span leaf=""><span textstyle="" style="font-size: 16px;">以</span></span></span><b style="font-size: 14px;color: rgb(204, 0, 0);"><span leaf=""><span textstyle="" style="font-size: 16px;">“亭”</span></span></b><span style="font-size: 14px;"><span leaf=""><span textstyle="" style="font-size: 16px;">为核心，用方块筑造你的天地。</span></span></span></p><p yne-bulb-block="paragraph" style="text-align:center;"><b style="color: rgb(17, 17, 17);font-size: 14px;"><span leaf=""><span textstyle="" style="font-size: 16px;">《率土之滨 》《我的世界》</span></span></b></p><p yne-bulb-block="paragraph" style="text-align:center;"><span style="color: rgb(17, 17, 17);font-size: 14px;"><span leaf=""><span textstyle="" style="font-size: 16px;">两个世界，一座亭台，万人共建——</span></span></span></p><p yne-bulb-block="paragraph" style="text-align:center;"><span style="color: rgb(17, 17, 17);font-size: 14px;"><span leaf=""><br  /></span></span></p></section><section style="text-align: center;" nodeleaf=""><img src="https://wechatrss.waytomaster.com/api/image?url=https%3A%2F%2Fmmbiz.qpic.cn%2Fmmbiz_jpg%2FGB0T7LO9ialNZpRtnia49F5guVPT19x9BaVOsQNjlrOqZ5w6oZDia6rJhkton7WzWXSYS2dib103BKfvCwYcia37rJqeXKWKZseiaxBkZKtcWWTvM%2F640%3Fwx_fmt%3Djpeg%26amp%3Bfrom%3Dappmsg" class="rich_pages wxw-img js_insertlocalimg" data-aistatus="1" data-imgfileid="505091888" data-ratio="10.592" data-s="300,640" data-src="https://wechatrss.waytomaster.com/api/image?url=h
